name: Windows EXE Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --windowed --name WPOS_PRO_2 app/wpos_app.py
      - run: pyinstaller --noconfirm --clean --windowed --name WPOS_Password_Reset app/reset_tool.py
      - uses: actions/upload-artifact@v4
        with:
          name: WPOS-PRO-2-Windows
          path: dist/
